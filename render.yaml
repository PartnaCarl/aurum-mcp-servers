services:
  - type: web
    name: aurum-fba-fee-calculator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: fastmcp run fba_fee_calculator_server.py
    plan: free
    envVars: []

  - type: web
    name: aurum-brand-compliance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: fastmcp run brand_compliance_server.py
    plan: free
    envVars: []

  - type: web
    name: aurum-sku-scorer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: fastmcp run sku_scorer_server.py
    plan: free
    envVars: []
